<!doctype html><meta charset="utf-8" /><style>
  body {
    margin: 0;
    background: #101e34;
  }
  canvas {
    display: block;
  }
  @font-face {
    font-family: Be;
    src: url("/public/BeVietnamPro-Bold.ttf");
  }
</style>
<script type="module">
  import * as T from "/three.js";
  const W = 920,
    H = 610,
    scene = new T.Scene();
  scene.background = new T.Color("#101e34");
  const camera = new T.PerspectiveCamera(36, W / H, 0.1, 100);
  camera.position.set(6.7, 5.4, 8.5);
  camera.lookAt(0, 0.7, 0);
  const renderer = new T.WebGLRenderer({
    antialias: true,
    preserveDrawingBuffer: true,
  });
  renderer.setSize(W, H);
  renderer.setPixelRatio(1);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = T.PCFSoftShadowMap;
  renderer.outputColorSpace = T.SRGBColorSpace;
  renderer.toneMapping = T.ACESFilmicToneMapping;
  renderer.toneMappingExposure = 1.35;
  const out = document.createElement("canvas");
  out.width = W;
  out.height = H;
  document.body.append(out);
  const ctx = out.getContext("2d");
  scene.add(new T.HemisphereLight(0xc7eeff, 0x0d1630, 2.4));
  const light = new T.DirectionalLight(0xffffff, 4);
  light.position.set(2, 8, 5);
  light.castShadow = true;
  light.shadow.mapSize.set(1024, 1024);
  light.shadow.camera.left = -9;
  light.shadow.camera.right = 9;
  light.shadow.camera.top = 9;
  light.shadow.camera.bottom = -9;
  light.shadow.normalBias = 0.03;
  scene.add(light);
  const rim = new T.DirectionalLight(0x24dfcf, 3);
  rim.position.set(-5, 3, -4);
  scene.add(rim);
  const floor = new T.Mesh(
    new T.PlaneGeometry(200, 200),
    new T.MeshStandardMaterial({ color: 0x101e34, roughness: 0.8 }),
  );
  floor.rotation.x = -Math.PI / 2;
  floor.position.y = -0.65;
  floor.receiveShadow = true;
  scene.add(floor);
  let group = new T.Group();
  scene.add(group);
  let mode = "",
    fan,
    blocks = [],
    labels = [];
  const mat = (color, metalness = 0.25) =>
    new T.MeshStandardMaterial({ color, metalness, roughness: 0.35 });
  function box(w, h, d, color, x = 0, y = 0, z = 0, parent = group) {
    const m = new T.Mesh(new T.BoxGeometry(w, h, d), mat(color));
    m.position.set(x, y, z);
    m.castShadow = true;
    m.receiveShadow = true;
    parent.add(m);
    return m;
  }
  function cylinder(r, h, color, x, y, z, parent = group) {
    const m = new T.Mesh(new T.CylinderGeometry(r, r, h, 48), mat(color, 0.65));
    m.position.set(x, y, z);
    m.castShadow = true;
    parent.add(m);
    return m;
  }
  function torus(r, t, color, x, y, z, parent = group) {
    const m = new T.Mesh(new T.TorusGeometry(r, t, 10, 64), mat(color, 0.7));
    m.rotation.x = -Math.PI / 2;
    m.position.set(x, y, z);
    parent.add(m);
    return m;
  }
  function textLabel(text, pos, color = "#e7f0ff", size = 25) {
    labels.push({ text, pos: new T.Vector3(...pos), color, size });
  }
  function psu(x = 0, scale = 1) {
    const p = new T.Group();
    p.position.x = x;
    p.scale.setScalar(scale);
    group.add(p);
    box(3.5, 1.9, 2.6, 0x28354b, 0, 0.4, 0, p);
    box(3.55, 0.09, 2.66, 0x596879, 0, 1.4, 0, p);
    for (let k = 0; k < 6; k++)
      torus(0.25 + k * 0.13, 0.018, 0x91a2af, 0, 1.46, 0, p);
    fan = new T.Group();
    fan.position.set(0, 1.44, 0);
    p.add(fan);
    cylinder(0.24, 0.1, 0x9baab7, 0, 0, 0, fan);
    for (let i = 0; i < 7; i++) {
      const blade = box(0.85, 0.045, 0.28, 0x19263c, 0.5, 0, 0, new T.Group());
      const rotor = blade.parent;
      rotor.rotation.y = (i * Math.PI * 2) / 7;
      fan.add(rotor);
    }
    for (let i = 0; i < 7; i++)
      for (let j = 0; j < 3; j++)
        box(
          0.23,
          0.1,
          0.06,
          0x070e1a,
          -1.35 + i * 0.43,
          0.05 + j * 0.31,
          1.33,
          p,
        );
    box(1.05, 0.52, 0.08, 0x090f1a, -0.9, 0.42, -1.35, p);
    for (let i = 0; i < 4; i++) {
      const c = new T.CatmullRomCurve3([
        new T.Vector3(1.65, 0.45, -0.6 + i * 0.25),
        new T.Vector3(2.3, 0.25, -0.9 + i * 0.25),
        new T.Vector3(2.7, -0.1, -0.2 + i * 0.25),
      ]);
      p.add(
        new T.Mesh(
          new T.TubeGeometry(c, 24, 0.04, 8, false),
          mat(i % 2 ? 0xf3c861 : 0x41d8bd),
        ),
      );
    }
    return p;
  }
  function ssd(parent = group, x = 0, scale = 1) {
    const p = new T.Group();
    p.position.x = x;
    p.scale.setScalar(scale);
    parent.add(p);
    box(6, 0.1, 1.7, 0x147962, 0, 0, 0, p);
    for (let i = 0; i < 4; i++) {
      box(0.9, 0.2, 1.15, 0x172330, -1.6 + i * 1.12, 0.15, 0, p);
      for (let j = 0; j < 6; j++) {
        box(
          0.05,
          0.05,
          0.16,
          0xa8b9c9,
          -1.94 + i * 1.12 + j * 0.13,
          0.09,
          0.65,
          p,
        );
        box(
          0.05,
          0.05,
          0.16,
          0xa8b9c9,
          -1.94 + i * 1.12 + j * 0.13,
          0.09,
          -0.65,
          p,
        );
      }
    }
    for (let i = 0; i < 12; i++)
      box(0.14, 0.03, 0.45, 0xe5b95b, 2.77, 0.07, -0.7 + i * 0.126, p);
    torus(0.15, 0.04, 0xe1d7b6, -2.74, 0.07, 0, p);
    for (let i = 0; i < 18; i++)
      box(
        0.16,
        0.13,
        0.11,
        i % 2 ? 0xabbac5 : 0xd3c9a2,
        -2.3 + i * 0.26,
        0.11,
        0.72,
        p,
      );
    return p;
  }
  function reset(next) {
    group.traverse((o) => {
      if (o.geometry) o.geometry.dispose();
      if (o.material) o.material.dispose();
    });
    scene.remove(group);
    group = new T.Group();
    scene.add(group);
    blocks = [];
    labels = [];
    fan = null;
    mode = next;
    camera.position.set(6.7, 5.4, 8.5);
    camera.lookAt(0, 0.7, 0);
    if (next === "abstract") {
      for (let i = 0; i < 5; i++) {
        box(
          0.8,
          0.8,
          0.8,
          [0x4de0bd, 0xe8bf50, 0x7dacf2, 0xb7d9ed, 0x55baa8][i],
          (i - 2) * 1.05,
          0.2 + Math.abs(i - 2) * 0.25,
          0,
        );
      }
    }
    if (next === "psu") psu();
    if (next === "tiers") {
      camera.position.set(0, 5.9, 13.6);
      camera.lookAt(0, 1.1, 0);
      const names = [
          "Standard",
          "Bronze",
          "Silver",
          "Gold",
          "Platinum",
          "Titanium",
          "Ruby",
        ],
        values = [85, 88, 90, 92, 94, 95, 96],
        colors = [
          0xdee8f5, 0xb9834f, 0xaebccb, 0xe8bf50, 0xb5e2f2, 0x879cae, 0xd54770,
        ];
      for (let i = 0; i < 7; i++) {
        const h = values[i] * 0.033,
          x = (i - 3) * 1.12;
        box(0.88, h, 0.85, colors[i], x, h / 2 - 0.55, 0);
        textLabel(values[i] + "%", [x, h - 0.25, 0], "#ffffff", 27);
        textLabel(names[i], [x, -0.75, 1.1], "#cfdef0", 15);
      }
      textLabel("50% LOAD · 230V EU", [0, 3.25, 0], "#40e1c4", 26);
    }
    if (next === "flow") {
      psu(0, 0.85);
      for (let i = 0; i < 12; i++) {
        const a = box(0.16, 0.16, 0.16, 0x44ebc9);
        blocks.push(a);
      }
      textLabel("AC", [-3.15, 1.1, 0], "#8bb6ff", 34);
      textLabel("DC", [3.1, 1.1, 0], "#43e1c1", 34);
      textLabel("NHIỆT", [0, 3.1, 0], "#f3bd5d", 27);
    }
    if (next === "ssd") ssd();
    if (next === "wear") {
      camera.position.set(4, 7.7, 8.3);
      camera.lookAt(0, 0.4, 0);
      box(6.3, 0.13, 3.4, 0x146456, 0, -0.25, 0);
      for (let x = 0; x < 8; x++)
        for (let z = 0; z < 4; z++) {
          blocks.push(
            box(
              0.54,
              0.43,
              0.54,
              x < 6 ? 0x4acaad : 0xe2b85f,
              (x - 3.5) * 0.7,
              0.04,
              (z - 1.5) * 0.7,
            ),
          );
        }
      textLabel("NAND", [-1.1, 1.2, 0], "#70ead5", 30);
      textLabel("DỰ PHÒNG", [2.5, 1.35, 0], "#f7ce7a", 23);
    }
    if (next === "backup") {
      ssd(group, -1.9, 0.65);
      box(1.75, 1.5, 1.2, 0x367a9b, 2, 0, 0);
      for (let i = 0; i < 4; i++)
        box(1.3, 0.1, 0.04, 0x57eac9, 2, -0.4 + i * 0.27, 0.63);
      for (let i = 0; i < 5; i++) blocks.push(box(0.14, 0.14, 0.14, 0x60efc3));
      textLabel("SSD", [-2, 1.1, 0], "#b5d6ff", 30);
      textLabel("BẢN SAO ĐỘC LẬP", [2, 1.25, 0], "#5bf1ce", 23);
    }
  }
  function paintLabel(text, x, y, color, size) {
    ctx.font = `700 ${size}px Be`;
    ctx.textAlign = "center";
    ctx.lineWidth = 6;
    ctx.strokeStyle = "#101e34";
    ctx.strokeText(text, x, y);
    ctx.fillStyle = color;
    ctx.fillText(text, x, y);
  }
  await document.fonts.load("700 30px Be");
  window.draw = (next, frame = 0) => {
    if (next !== mode) reset(next);
    const t = frame / 30,
      phase = (t / 6) * Math.PI * 2;
    group.rotation.y = (mode === "tiers" ? 0.045 : 0.12) * Math.sin(phase);
    group.position.y = mode === "tiers" ? 0 : 0.08 * Math.sin(phase);
    if (fan) fan.rotation.y = t * Math.PI * 2;
    if (mode === "flow") {
      for (let i = 0; i < blocks.length; i++) {
        const u = (t / 2 + i / blocks.length) % 1;
        if (i < 9) blocks[i].position.set(-3.5 + u * 7, 0.3, 0.2);
        else blocks[i].position.set(0.3 + i * 0.02, 1.1 + u * 1.8, 0);
      }
    }
    if (mode === "wear") {
      blocks.forEach((b, i) => {
        b.position.y = 0.04 + Math.max(0, Math.sin(phase + i * 0.65)) * 0.22;
        b.material.color.setHex(
          i < 24
            ? Math.sin(phase + i * 0.65) > 0.8
              ? 0x86ffe1
              : 0x329e8a
            : 0xe2b85f,
        );
      });
    }
    if (mode === "backup") {
      blocks.forEach((b, i) => {
        const u = (t / 2 + i / 5) % 1;
        b.position.set(-0.9 + u * 2.2, 0.1 + Math.sin(u * Math.PI) * 0.5, 0.4);
      });
    }
    renderer.render(scene, camera);
    ctx.clearRect(0, 0, W, H);
    ctx.drawImage(renderer.domElement, 0, 0);
    for (const l of labels) {
      const p = l.pos.clone().applyMatrix4(group.matrixWorld).project(camera);
      paintLabel(
        l.text,
        (p.x * 0.5 + 0.5) * W,
        (-p.y * 0.5 + 0.5) * H,
        l.color,
        l.size,
      );
    }
    if (mode === "flow") {
      paintLabel("η = 80% : 500W → 400W + 100W nhiệt", 460, 539, "#f1c668", 26);
      paintLabel(
        "η = 90% : ≈444W → 400W + ≈44W nhiệt",
        460,
        580,
        "#67e6cc",
        26,
      );
    }
    if (mode === "ssd") {
      paintLabel("NVMe · Mô hình khái niệm", 460, 555, "#b7cde4", 27);
    }
    if (mode === "wear") {
      paintLabel(
        "Màu / chuyển động không biểu thị % hao mòn thật",
        460,
        570,
        "#b7cde4",
        22,
      );
    }
    paintLabel(
      "3D minh họa · Không phải sản phẩm / số đo thật",
      460,
      32,
      "#91a8c4",
      18,
    );
    return out.toDataURL("image/png").split(",")[1];
  };
  window.draw("psu", 0);
  window.ready = true;
</script>
